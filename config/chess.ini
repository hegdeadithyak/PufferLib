[base]
env_name = chess

[vec]
total_agents = 15
num_buffers  = 2
num_threads  = 16

[env]
selfplay = 0
human_side = 0
stockfish_enabled = 1
stockfish_depth = 8
stockfish_movetime_ms = 0
ppo_side = 0
randomize_ppo_side = 0
max_ppo_turns = 200
eval_shaping = 1

[policy]
hidden_size      = 256
num_layers       = 6
expansion_factor = 1

[torch]
network = TemporalTransformer
encoder = ChessViTEncoder
decoder = ChessDualDecoder

[train]
gpus            = 1
seed            = 42
total_timesteps = 100_000
learning_rate   = 0.001
anneal_lr       = 1
min_lr_ratio    = 0.0
gamma           = 0.995
gae_lambda      = 0.95
clip_coef       = 0.2
vf_coef         = 1.0
vf_clip_coef    = 0.2
max_grad_norm   = 0.5
ent_coef        = 0.015
beta1           = 0.9
beta2           = 0.999
eps             = 1e-8
minibatch_size  = 256
horizon         = 128
vtrace_rho_clip = 1.0
vtrace_c_clip   = 1.0
prio_alpha      = 0.8
prio_beta0      = 0.2
replay_ratio    = 1.0

[alphazero]
training_steps = 700_000
batch_size = 4096
replay_buffer_size = 500_000
min_replay_size = 4096
self_play_games_per_iteration = 1
train_steps_per_iteration = 1
mcts_simulations = 800
c_puct = 1.5
dirichlet_alpha = 0.3
root_dirichlet_fraction = 0.25
temperature = 1.0
temperature_moves = 30
max_game_plies = 512
channels = 256
blocks = 19
learning_rate = 0.2
momentum = 0.9
weight_decay = 1e-4
max_grad_norm = 5.0
lr_drop_1 = 100_000
lr_drop_2 = 300_000
lr_drop_3 = 500_000
curriculum = standard
device = auto
