[base]
env_name = chess

[vec]
total_agents = 4096
num_buffers  = 2
num_threads  = 16

[env]
selfplay = 0
human_side = 0

[policy]
hidden_size      = 256
num_layers       = 6
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus            = 1
seed            = 42
total_timesteps = 100_000_000
learning_rate   = 0.001
anneal_lr       = 1
min_lr_ratio    = 0.0
gamma           = 0.995
gae_lambda      = 0.95
clip_coef       = 0.2
vf_coef         = 1.0
vf_clip_coef    = 0.2
max_grad_norm   = 1.0
ent_coef        = 0.005
beta1           = 0.95
beta2           = 0.999
eps             = 1e-12
minibatch_size  = 8192
horizon         = 128
vtrace_rho_clip = 1.0
vtrace_c_clip   = 1.0
prio_alpha      = 0.8
prio_beta0      = 0.2
replay_ratio    = 1.0
